name = "mine-imposer-server"
main = "server/index.ts"
compatibility_date = "2025-07-15"

[durable_objects]
bindings = [
  { name = "GAME_SERVER", class_name = "MineImposerGame" }
]

[[d1_databases]]
binding = "DB"
database_name = "mine-imposer-db"
database_id = "local-d1-mine-imposer-db"

[[migrations]]
tag = "v1"
new_classes = ["MineImposerGame"]
